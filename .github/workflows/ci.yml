name: CI develop

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Actualizar README
        shell: bash
        run: |
          RAMA="${{ github.event.pull_request.head.ref || github.ref_name }}"
          echo "Añadida feature: $RAMA" >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualizar README desde CI [skip ci]"
          git push

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar DEV_TOKEN
        env:
          TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "DEV_TOKEN correcto"
          } else {
            Write-Host "DEV_TOKEN incorrecto"
            exit 1
          }